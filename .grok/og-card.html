<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Digital Business Store</title>
  <style>
    @font-face {
      font-family: Cinzel;
      src: url("fonts/Cinzel.ttf") format("truetype");
      font-weight: 400 900;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: Cormorant;
      src: url("fonts/CormorantGaramond-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: Cormorant;
      src: url("fonts/CormorantGaramond-Italic.ttf") format("truetype");
      font-weight: 400;
      font-style: italic;
      font-display: block;
    }
    @font-face {
      font-family: Cormorant;
      src: url("fonts/CormorantGaramond-SemiBold.ttf") format("truetype");
      font-weight: 600;
      font-style: normal;
      font-display: block;
    }

    html, body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #0B0C10;
    }

    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      background:
        radial-gradient(ellipse 62% 58% at 50% 46%, #1a1c24 0%, #111318 42%, #0B0C10 78%);
      color: #F7F6F3;
    }

    .lattice {
      position: absolute;
      inset: 0;
      opacity: 0.07;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='48'><path d='M24 2 L46 24 L24 46 L2 24 Z' fill='none' stroke='%23C9A227' stroke-width='1'/></svg>");
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 70% 65% at 50% 50%, transparent 20%, black 90%);
    }

    .glow {
      position: absolute;
      left: 50%;
      top: 42%;
      width: 420px;
      height: 280px;
      transform: translate(-50%, -50%);
      background: radial-gradient(ellipse at center, rgba(201,162,39,0.16), transparent 68%);
      pointer-events: none;
    }

    .frame {
      position: absolute;
      inset: 26px;
      border: 1px solid rgba(201, 162, 39, 0.42);
      pointer-events: none;
    }
    .frame-inner {
      position: absolute;
      inset: 32px;
      border: 1px solid rgba(201, 162, 39, 0.16);
      pointer-events: none;
    }

    .corner {
      position: absolute;
      width: 18px;
      height: 18px;
      fill: #C9A227;
    }
    .corner.tl { top: 20px; left: 20px; }
    .corner.tr { top: 20px; right: 20px; transform: scaleX(-1); }
    .corner.bl { bottom: 20px; left: 20px; transform: scaleY(-1); }
    .corner.br { bottom: 20px; right: 20px; transform: scale(-1); }

    .lockup {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -52%);
      width: 720px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .pillar {
      width: 92px;
      height: 118px;
      margin-bottom: 18px;
    }

    .kicker {
      font-family: Cinzel, "Liberation Serif", serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.46em;
      color: #C9A227;
      margin: 0 0 14px;
      text-indent: 0.46em;
    }

    h1 {
      font-family: Cinzel, "Liberation Serif", serif;
      font-weight: 700;
      margin: 0;
      color: #C9A227;
      line-height: 0.95;
    }
    h1 .line1 {
      display: block;
      font-size: 64px;
      letter-spacing: 0.22em;
      text-indent: 0.22em;
    }
    h1 .line2 {
      display: block;
      font-size: 34px;
      letter-spacing: 0.28em;
      text-indent: 0.28em;
      margin-top: 10px;
      font-weight: 600;
    }

    .rule {
      width: 220px;
      height: 1px;
      margin: 18px 0 14px;
      background: linear-gradient(90deg, transparent, #C9A227 18%, #C9A227 82%, transparent);
    }

    .tagline {
      font-family: Cormorant, "Liberation Serif", serif;
      font-style: italic;
      font-weight: 400;
      font-size: 22px;
      letter-spacing: 0.04em;
      color: #F7F6F3;
      margin: 0;
      opacity: 0.92;
    }

    .product {
      position: absolute;
      fill: none;
      stroke: #C9A227;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .phone { left: 88px; top: 210px; width: 78px; height: 150px; }
    .watch { left: 108px; top: 390px; width: 86px; height: 110px; }
    .headphones { right: 80px; top: 236px; width: 150px; height: 150px; }

    .plinth {
      position: absolute;
      left: 80px;
      right: 80px;
      bottom: 52px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(201,162,39,0.35) 12%, rgba(201,162,39,0.35) 88%, transparent);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="lattice"></div>
    <div class="glow"></div>
    <div class="frame"></div>
    <div class="frame-inner"></div>

    <svg class="corner tl" viewBox="0 0 18 18" aria-hidden="true">
      <path d="M1 17 V4 Q1 1 4 1 H17" fill="none" stroke="#C9A227" stroke-width="1.4"/>
      <path d="M9 1 L13 5 L9 9 L5 5 Z" fill="#C9A227"/>
    </svg>
    <svg class="corner tr" viewBox="0 0 18 18" aria-hidden="true">
      <path d="M1 17 V4 Q1 1 4 1 H17" fill="none" stroke="#C9A227" stroke-width="1.4"/>
      <path d="M9 1 L13 5 L9 9 L5 5 Z" fill="#C9A227"/>
    </svg>
    <svg class="corner bl" viewBox="0 0 18 18" aria-hidden="true">
      <path d="M1 17 V4 Q1 1 4 1 H17" fill="none" stroke="#C9A227" stroke-width="1.4"/>
      <path d="M9 1 L13 5 L9 9 L5 5 Z" fill="#C9A227"/>
    </svg>
    <svg class="corner br" viewBox="0 0 18 18" aria-hidden="true">
      <path d="M1 17 V4 Q1 1 4 1 H17" fill="none" stroke="#C9A227" stroke-width="1.4"/>
      <path d="M9 1 L13 5 L9 9 L5 5 Z" fill="#C9A227"/>
    </svg>

    <!-- smartphone -->
    <svg class="product phone" viewBox="0 0 78 150" aria-hidden="true">
      <rect x="10" y="4" width="58" height="142" rx="8" stroke-width="1.6"/>
      <rect x="16" y="16" width="46" height="108" rx="2" stroke-width="1"/>
      <rect x="34" y="8" width="10" height="4" rx="2" stroke-width="1" fill="#C9A227"/>
      <circle cx="39" cy="136" r="4.5" stroke-width="1.2"/>
    </svg>

    <!-- watch -->
    <svg class="product watch" viewBox="0 0 86 110" aria-hidden="true">
      <path d="M33 18 V8 H53 V18" stroke-width="1.6"/>
      <path d="M33 92 V102 H53 V92" stroke-width="1.6"/>
      <circle cx="43" cy="55" r="28" stroke-width="1.8"/>
      <circle cx="43" cy="55" r="22" stroke-width="1"/>
      <circle cx="73" cy="55" r="3" stroke-width="1.4"/>
      <path d="M43 55 L43 38" stroke-width="1.6"/>
      <path d="M43 55 L58 55" stroke-width="1.4"/>
      <circle cx="43" cy="55" r="2.2" fill="#C9A227" stroke="none"/>
    </svg>

    <!-- headphones -->
    <svg class="product headphones" viewBox="0 0 150 150" aria-hidden="true">
      <path d="M28 92 V78 A47 47 0 0 1 122 78 V92" fill="none" stroke-width="6"/>
      <rect x="14" y="84" width="28" height="42" rx="10" stroke-width="1.8"/>
      <rect x="108" y="84" width="28" height="42" rx="10" stroke-width="1.8"/>
      <path d="M42 96 H50" stroke-width="1.4"/>
      <path d="M108 96 H100" stroke-width="1.4"/>
    </svg>

    <div class="lockup">
      <svg class="pillar" viewBox="0 0 92 118" aria-hidden="true">
        <polygon points="46,2 88,32 4,32" fill="#C9A227"/>
        <rect x="4" y="32" width="84" height="8" fill="#C9A227"/>
        <rect x="8" y="44" width="18" height="58" fill="#C9A227"/>
        <rect x="37" y="44" width="18" height="58" fill="#C9A227"/>
        <rect x="66" y="44" width="18" height="58" fill="#C9A227"/>
        <rect x="4" y="104" width="84" height="10" fill="#C9A227"/>
        <rect x="10" y="44" width="4" height="58" fill="#0B0C10" opacity="0.28"/>
        <rect x="39" y="44" width="4" height="58" fill="#0B0C10" opacity="0.28"/>
        <rect x="68" y="44" width="4" height="58" fill="#0B0C10" opacity="0.28"/>
      </svg>
      <p class="kicker">DBS</p>
      <h1>
        <span class="line1">DIGITAL</span>
        <span class="line2">BUSINESS STORE</span>
      </h1>
      <div class="rule"></div>
      <p class="tagline">L’innovation au service de votre quotidien</p>
    </div>
  </div>
</body>
</html>
